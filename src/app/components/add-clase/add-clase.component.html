<div class="container">
  <!-- Loading State -->
  <div *ngIf="isLoading" class="card loading-card">
    <div class="card-header">
      <h2>Cargando...</h2>
    </div>
    <div class="card-body">
      <div class="spinner-container">
        <div class="spinner"></div>
        <p>Cargando...</p>
      </div>
    </div>
  </div>

  <!-- Add Form -->
  <div *ngIf="!isLoading" class="card">
    <div class="card-header">
      <h2>
        Agregar Clase
      </h2>
    </div>
    
    <form #claseForm="ngForm" (ngSubmit)="onSubmit(claseForm)">
      <div class="card-body">
        <div class="form-grid">
          <!-- Día de la Semana -->
          <div class="form-group">
            <label for="diaSemana" class="form-label">
              <strong>Día de la Semana <span class="required">*</span></strong>
            </label>
            <select 
              class="form-control" 
              id="diaSemana"
              name="diaSemana"
              [(ngModel)]="clase.diaSemana"
              #diaSemana="ngModel"
              required>
              <option value="">Seleccione un día...</option>
              <option *ngFor="let dia of diasSemana" [value]="dia">{{ dia }}</option>
            </select>
            <div *ngIf="diaSemana.invalid && (diaSemana.dirty || diaSemana.touched)" class="error-message">
              <div *ngIf="diaSemana.errors?.['required']">El día de la semana es requerido</div>
            </div>
          </div>

          <!-- Hora -->
          <div class="form-group">
            <label for="hora" class="form-label">
              <strong>Hora <span class="required">*</span></strong>
            </label>
            <input 
              type="time" 
              class="form-control" 
              id="hora"
              name="hora"
              [(ngModel)]="clase.hora"
              #hora="ngModel"
              required
              placeholder="HH:MM">
            <div *ngIf="hora.invalid && (hora.dirty || hora.touched)" class="error-message">
              <div *ngIf="hora.errors?.['required']">La hora es requerida</div>
            </div>
          </div>

          <!-- Cupo Máximo -->
          <div class="form-group">
            <label for="cupoMax" class="form-label">
              <strong>Cupo Máximo <span class="required">*</span></strong>
            </label>
            <input 
              type="number" 
              class="form-control" 
              id="cupoMax"
              name="cupoMax"
              [(ngModel)]="clase.cupoMax"
              #cupoMax="ngModel"
              required
              min="1"
              placeholder="Ej: 20">
            <div class="help-text">Número máximo de personas que pueden participar</div>
            <div *ngIf="cupoMax.invalid && (cupoMax.dirty || cupoMax.touched)" class="error-message">
              <div *ngIf="cupoMax.errors?.['required']">El cupo máximo es requerido</div>
              <div *ngIf="cupoMax.errors?.['min']">El cupo máximo debe ser mayor a 0</div>
            </div>
          </div>

          <!-- Nombre -->
          <div class="form-group full-width">
            <label for="nombre" class="form-label">
              <strong>Nombre de la Clase <span class="required">*</span></strong>
            </label>
            <input 
              type="text" 
              class="form-control" 
              id="nombre"
              name="nombre"
              [(ngModel)]="clase.nombre"
              #nombre="ngModel"
              required
              maxlength="45"
              placeholder="Ej: Yoga Matutino, CrossFit Avanzado">
            <div *ngIf="nombre.invalid && (nombre.dirty || nombre.touched)" class="error-message">
              <div *ngIf="nombre.errors?.['required']">El nombre es requerido</div>
            </div>
          </div>

          <!-- Descripción -->
          <div class="form-group full-width">
            <label for="descripcion" class="form-label">
              <strong>Descripción <span class="required">*</span></strong>
            </label>
            <textarea 
              class="form-control" 
              id="descripcion"
              name="descripcion"
              [(ngModel)]="clase.descripcion"
              #descripcion="ngModel"
              required
              rows="4"
              maxlength="500"
              placeholder="Describe la clase, objetivos, nivel requerido, etc."></textarea>
            <div *ngIf="descripcion.invalid && (descripcion.dirty || descripcion.touched)" class="error-message">
              <div *ngIf="descripcion.errors?.['required']">La descripción es requerida</div>
            </div>
          </div>


        </div>

        <!-- Validation Errors -->
        <div *ngIf="validationErrors.length > 0" class="error-alert">
          <h6><span class="icon">⚠️</span> Errores de validación:</h6>
          <ul>
            <li *ngFor="let error of validationErrors">{{error}}</li>
          </ul>
        </div>
      </div>

      <div class="card-footer">
        <button 
          type="button" 
          class="btn-secondary"
          (click)="goBack()">
          Cancelar
        </button>
        
        <button 
          type="submit" 
          class="btn-primary"
          [disabled]="!claseForm.form.valid || isLoading">
          <span *ngIf="!isLoading">Crear Clase</span>
          <span *ngIf="isLoading">
            <span class="loading-icon">⏳</span> Guardando...
          </span>
        </button>
      </div>
    </form>
  </div>
</div>
