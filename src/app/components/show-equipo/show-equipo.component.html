<div class="container" *ngIf="equipo">
  <div class="card">
    <div class="card-header">
      <h2>Detalles del Equipo</h2>
      <div class="actions">
        <button class="btn-primary" (click)="editEquipo()" title="Editar equipo"> 
          Editar
        </button>
        <button class="btn-danger" (click)="deleteEquipo()" title="Eliminar equipo">
          Eliminar
        </button>
      </div>
    </div>
    
    <div class="card-body">
      <div class="details-grid">
        <div class="detail-item">
          <label>ID del Equipo:</label>
          <span>{{ equipo.idEquipo }}</span>
        </div>
        
        <div class="detail-item">
          <label>Nombre:</label>
          <span class="highlight">{{ equipo.nombre }}</span>
        </div>
        
        <div class="detail-item">
          <label>Tipo:</label>
          <span>{{ equipo.tipo }}</span>
        </div>
        
        <div class="detail-item">
          <label>Estado:</label>
          <span class="estado-badge" [ngClass]="{
            'bueno': equipo.estado === 1,
            'malo': equipo.estado === 0
          }">
            {{ getEstadoTexto(equipo.estado) }}
          </span>
        </div>

        <div class="detail-item">
          <label>Cantidad Disponible:</label>
          <span class="cantidad-badge">{{ equipo.cantidad }} unidades</span>
        </div>
      </div>
    </div>
    
    <div class="card-footer">
      <button class="btn-secondary" (click)="back()">
        Volver a la Lista
      </button>
    </div>
  </div>
</div>

<div class="container" *ngIf="!equipo && !isLoading">
  <div class="card error-card">
    <h2>Equipo No Encontrado</h2>
    <p>El equipo que buscas no existe o no se pudo cargar.</p>
    <button class="btn-secondary" (click)="back()">Volver a la Lista</button>
  </div>
</div>

<div class="container" *ngIf="isLoading">
  <div class="card loading-card">
    <h2>Cargando...</h2>
    <div class="spinner"></div>
  </div>
</div>
