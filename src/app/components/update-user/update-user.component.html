<div class="container">
  <div class="card">
    <div class="card-header">
      <h2>Editar Usuario</h2>
    </div>

    <form (ngSubmit)="updateUser()" #userForm="ngForm">
      <div class="card-body">
        <div class="form-grid">
          <!-- ID -->
          <div class="form-group">
            <label for="idUsuario" class="form-label">ID Usuario</label>
            <input type="text" id="idUsuario" class="form-control" [(ngModel)]="user.idUsuario" name="idUsuario" required disabled>
          </div>

          <!-- Nombre -->
          <div class="form-group">
            <label for="nombre" class="form-label">Nombre <span class="required">*</span></label>
            <input type="text" id="nombre" class="form-control" [(ngModel)]="user.nombre" name="nombre" required>
          </div>

          <!-- Apellido -->
          <div class="form-group">
            <label for="apellido" class="form-label">Apellido <span class="required">*</span></label>
            <input type="text" id="apellido" class="form-control" [(ngModel)]="user.apellido" name="apellido" required>
          </div>

          <!-- Cédula -->
          <div class="form-group">
            <label for="cedula" class="form-label">Cédula <span class="required">*</span></label>
            <input type="text" id="cedula" class="form-control" [(ngModel)]="user.cedula" name="cedula" required>
          </div>

          <!-- Email -->
          <div class="form-group">
            <label for="email" class="form-label">Correo electrónico</label>
            <input type="email" id="email" class="form-control" [(ngModel)]="user.email" name="email" disabled>
          </div>

          <!-- Password -->
          <div class="form-group full-width">
            <label for="password" class="form-label">Nueva Contraseña (opcional)</label>
            <input type="password" id="password" class="form-control" [(ngModel)]="user.password" name="password" placeholder="Dejar vacío para mantener la actual">
          </div>

          <!-- Rol -->
          <div class="form-group">
            <label for="rol" class="form-label">Rol <span class="required">*</span></label>
            <select id="rol" class="form-control" [(ngModel)]="user.rol" name="rol" required (change)="onRolChange()">
              <option value="cliente">Cliente</option>
              <option value="admin">Administrador</option>
              <option value="entrenador">Entrenador</option>
            </select>
          </div>

          <!-- Teléfonos -->
          <div class="telefono-section">
            <div class="telefono-header">
              <h3>Teléfonos (Opcional)</h3>
              <button type="button" class="btn-add-telefono" (click)="addTelefono()">+ Agregar Teléfono</button>
            </div>

            <div *ngIf="user.telefonos.length === 0" class="no-telefonos">
              <p>No hay teléfonos agregados. Puedes añadir uno o más.</p>
            </div>

            <div *ngFor="let telefono of user.telefonos; let i = index; trackBy: trackByIndex" 
                 class="telefono-item"
                 [class.marcado-para-eliminacion]="isTelefonoMarcadoParaEliminacion(telefono)">
              
              <div *ngIf="isTelefonoMarcadoParaEliminacion(telefono)" class="eliminacion-indicator">
                ⚠️ Este teléfono será eliminado al guardar
              </div>

              <div class="telefono-row">
                <div class="form-group small">
                  <label [for]="'tipoTel' + i" class="form-label">Tipo</label>
                  <select [(ngModel)]="telefono.tipoTel" [name]="'tipoTel' + i" [id]="'tipoTel' + i" class="form-control"
                          [disabled]="isTelefonoMarcadoParaEliminacion(telefono)">
                    <option value="">Seleccionar tipo</option>
                    <option value="celular">Celular</option>
                    <option value="casa">Casa</option>
                    <option value="trabajo">Trabajo</option>
                  </select>
                </div>

                <div class="form-group small">
                  <label [for]="'telefono' + i" class="form-label">Número</label>
                  <input type="text" class="form-control"
                         [(ngModel)]="telefono.telefono"
                         [name]="'telefono' + i"
                         [id]="'telefono' + i"
                         placeholder="Ej: 12345678"
                         maxlength="12"
                         pattern="[0-9]{8,12}"
                         title="Solo números (8-12 dígitos)"
                         [disabled]="isTelefonoMarcadoParaEliminacion(telefono)">
                </div>

                <button type="button"
                        class="btn-remove"
                        (click)="removeTelefono(i)"
                        [title]="isTelefonoMarcadoParaEliminacion(telefono) ? 'Desmarcar' : 'Eliminar'">
                  {{ isTelefonoMarcadoParaEliminacion(telefono) ? '↺' : '×' }}
                </button>
              </div>
            </div>
          </div>
        </div>

        <!-- Validaciones -->
        <div *ngIf="validationErrors.length > 0" class="error-alert">
          <h6>⚠️ Errores de validación:</h6>
          <ul>
            <li *ngFor="let error of validationErrors">{{ error }}</li>
          </ul>
        </div>
      </div>

      <div class="card-footer">
        <button type="button" class="btn-secondary" (click)="cancel()">Cancelar</button>
        <button type="submit" class="btn-primary" [disabled]="!userForm.form.valid">
          Guardar Cambios
        </button>
      </div>
    </form>
  </div>
</div>
