<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Agregar Método de Pago</title>
  <link rel="stylesheet" href="add-metodopago.component.css">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
  <div class="container">
    <div class="card shadow p-4">
      <h2 class="mb-4 text-center">Agregar Método de Pago</h2>
      <form #metodoPagoForm="ngForm" (ngSubmit)="onSubmit(metodoPagoForm)">
        
        <div class="form-group">
          <label for="nombre">Nombre del Método</label>
          <input [(ngModel)]="metodoPago.nombre" name="nombre" id="nombre" type="text" 
                 placeholder="Ej: Efectivo, Tarjeta de Crédito, SINPE" required />
        </div>
        
        <div class="form-group">
          <label for="descripcion">Descripción</label>
          <textarea [(ngModel)]="metodoPago.descripcion" name="descripcion" id="descripcion" 
                    rows="3" placeholder="Describe el método de pago y sus características" required></textarea>
        </div>
        
        <div class="form-group">
          <label for="comision">Comisión (%)</label>
          <input [(ngModel)]="metodoPago.comision" name="comision" id="comision" type="number" 
                 min="0" max="100" step="0.01" placeholder="Porcentaje de comisión" required />
          <small class="form-text">Ingresa la comisión como porcentaje (0-100%)</small>
        </div>
        
        <div class="form-group">
          <label for="requiereAutorizacion">Requiere Autorización</label>
          <select [(ngModel)]="metodoPago.requiereAutorizacion" name="requiereAutorizacion" id="requiereAutorizacion" required>
            <option [value]="0">No</option>
            <option [value]="1">Sí</option>
          </select>
          <small class="form-text">Indica si el método requiere autorización adicional</small>
        </div>
        
        <div class="form-group">
          <label for="activo">Estado</label>
          <select [(ngModel)]="metodoPago.activo" name="activo" id="activo" required>
            <option [value]="1">Activo</option>
            <option [value]="0">Inactivo</option>
          </select>
        </div>

        <div class="button-group">
          <button type="submit" class="btn-primary" [disabled]="!metodoPagoForm.form.valid || isLoading">
            <span *ngIf="isLoading">Guardando...</span>
            <span *ngIf="!isLoading">Crear Método de Pago</span>
          </button>
          <button type="button" class="btn-secondary" (click)="goBack()">Cancelar</button>
        </div>
      </form>
      
      <div *ngIf="validationErrors.length > 0" class="alert alert-danger mt-3">
        <h4>Errores de validación:</h4>
        <ul>
          <li *ngFor="let err of validationErrors">{{ err }}</li>
        </ul>
      </div>
    </div>
  </div>
</body>
</html>
