<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Agregar Membresía</title>
  <link rel="stylesheet" href="add-membresia.component.css">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
  <div class="container">
    <div class="card shadow p-4">
      <h2 class="mb-4 text-center">Agregar Membresía</h2>
      <form #membresiaForm="ngForm" (ngSubmit)="onSubmit(membresiaForm)">
        
        <div class="form-group">
          <label for="tipo">Tipo de Membresía</label>
          <input [(ngModel)]="membresia.tipo" name="tipo" id="tipo" type="text" 
                 placeholder="Ej: Básica, Premium, VIP" required />
        </div>
        
        <div class="form-group">
          <label for="precio">Precio (₡)</label>
          <input [(ngModel)]="membresia.precio" name="precio" id="precio" type="number" 
                 min="0" step="0.01" placeholder="Precio en colones" required />
        </div>
        
        <div class="form-group">
          <label for="duracionMeses">Duración (meses)</label>
          <input [(ngModel)]="membresia.duracionMeses" name="duracionMeses" id="duracionMeses" 
                 type="number" min="1" max="36" placeholder="Duración en meses" required />
          <small class="form-text">Duración entre 1 y 36 meses</small>
        </div>
        
        <div class="form-group">
          <label for="descripcion">Descripción</label>
          <textarea [(ngModel)]="membresia.descripcion" name="descripcion" id="descripcion" 
                    rows="4" placeholder="Describe los beneficios y características de la membresía" required></textarea>
        </div>
        
        <div class="form-group">
          <label for="estado">Estado</label>
          <select [(ngModel)]="membresia.estado" name="estado" id="estado" required>
            <option [value]="1">Activa</option>
            <option [value]="0">Inactiva</option>
          </select>
        </div>

        <div class="button-group">
          <button type="submit" class="btn-primary" [disabled]="!membresiaForm.form.valid || isLoading">
            <span *ngIf="isLoading">Guardando...</span>
            <span *ngIf="!isLoading">Crear Membresía</span>
          </button>
          <button type="button" class="btn-secondary" (click)="goBack()">Cancelar</button>
        </div>
      </form>
      
      <div *ngIf="validationErrors.length > 0" class="alert alert-danger mt-3">
        <h4>Errores de validación:</h4>
        <ul>
          <li *ngFor="let err of validationErrors">{{ err }}</li>
        </ul>
      </div>
    </div>
  </div>
</body>
</html>
