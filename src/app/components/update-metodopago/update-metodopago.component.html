<div class="container">
  <!-- Loading State -->
  <div *ngIf="isLoading" class="card loading-card">
    <div class="card-header">
      <h2>Cargando...</h2>
    </div>
    <div class="card-body">
      <div class="spinner-container">
        <div class="spinner"></div>
        <p>Cargando datos del método de pago...</p>
      </div>
    </div>
  </div>

  <!-- Update Form -->
  <div *ngIf="!isLoading" class="card">
    <div class="card-header">
      <h2>
        Editar Método de Pago
      </h2>
    </div>
    
    <form #metodoPagoForm="ngForm" (ngSubmit)="onSubmit(metodoPagoForm)">
      <div class="card-body">
        <div class="form-grid">
          <!-- Nombre -->
          <div class="form-group">
            <label for="nombre" class="form-label">
              <strong>Nombre del Método <span class="required">*</span></strong>
            </label>
            <input 
              type="text" 
              class="form-control" 
              id="nombre"
              name="nombre"
              [(ngModel)]="metodoPago.nombre"
              #nombre="ngModel"
              required
              maxlength="45"
              placeholder="Ej: Tarjeta de Crédito, PayPal">
            <div *ngIf="nombre.invalid && (nombre.dirty || nombre.touched)" class="error-message">
              <div *ngIf="nombre.errors?.['required']">El nombre es requerido</div>
            </div>
          </div>

          <!-- Comisión -->
          <div class="form-group">
            <label for="comision" class="form-label">
              <strong>Comisión (%)</strong>
            </label>
            <input 
              type="number" 
              class="form-control" 
              id="comision"
              name="comision"
              [(ngModel)]="metodoPago.comision"
              #comision="ngModel"
              min="0"
              max="100"
              step="0.01"
              placeholder="0.00">
            <div *ngIf="comision.invalid && (comision.dirty || comision.touched)" class="error-message">
              <div *ngIf="comision.errors?.['min']">La comisión no puede ser negativa</div>
              <div *ngIf="comision.errors?.['max']">La comisión no puede exceder 100%</div>
            </div>
          </div>

          <!-- Estado -->
          <div class="form-group">
            <label for="estado" class="form-label">
              <strong>Estado <span class="required">*</span></strong>
            </label>
            <select 
              class="form-control" 
              id="estado"
              name="estado"
              [(ngModel)]="metodoPago.estado"
              #estado="ngModel"
              required>
              <option value="">Seleccionar estado...</option>
              <option [value]="1">Activo</option>
              <option [value]="0">Inactivo</option>
            </select>
            <div *ngIf="estado.invalid && (estado.dirty || estado.touched)" class="error-message">
              <div *ngIf="estado.errors?.['required']">Debe seleccionar un estado</div>
            </div>
          </div>

          <!-- Requiere Autorización -->
          <div class="form-group">
            <label for="requiereAutorizacion" class="form-label">
              <strong>Requiere Autorización</strong>
            </label>
            <select 
              class="form-control" 
              id="requiereAutorizacion"
              name="requiereAutorizacion"
              [(ngModel)]="metodoPago.requiereAutorizacion">
              <option [value]="0">No</option>
              <option [value]="1">Sí</option>
            </select>
          </div>

          <!-- Descripción -->
          <div class="form-group full-width">
            <label for="descripcion" class="form-label">
              <strong>Descripción</strong>
            </label>
            <textarea 
              class="form-control" 
              id="descripcion"
              name="descripcion"
              [(ngModel)]="metodoPago.descripcion"
              #descripcion="ngModel"
              rows="4"
              maxlength="100"
              placeholder="Describe las características y condiciones de este método de pago..."></textarea>
            <small class="form-text">Máximo 100 caracteres (opcional)</small>
          </div>
        </div>

        <!-- Errores de validación -->
        <div *ngIf="validationErrors.length > 0" class="error-alert">
          <h6>❌ Errores de validación:</h6>
          <ul>
            <li *ngFor="let error of validationErrors">{{ error }}</li>
          </ul>
        </div>
      </div>

      <div class="card-footer">
        <button 
          type="button" 
          class="btn-secondary" 
          (click)="goBack()"
          [disabled]="isLoading">
          Cancelar
        </button>
        
        <button 
          type="submit" 
          class="btn-primary" 
          [disabled]="!metodoPagoForm.form.valid || isLoading">
          <span *ngIf="isLoading">Guardando...</span>
          <span *ngIf="!isLoading">Actualizar Método</span>
        </button>
      </div>
    </form>
  </div>
</div>
