<div class="container mt-4">
  <div class="row justify-content-center">
    <div class="col-md-8">
      <div class="card shadow">
        <div class="card-header bg-primary text-white">
          <h4 class="card-title mb-0">
            <i class="fas fa-edit me-2"></i>Editar Membresía
          </h4>
        </div>
        <div class="card-body">
          <div *ngIf="isLoading" class="text-center py-4">
            <div class="spinner-border text-primary" role="status">
              <span class="visually-hidden">Cargando...</span>
            </div>
            <p class="mt-2">Cargando datos de la membresía...</p>
          </div>

          <form *ngIf="!isLoading" #membresiaForm="ngForm" (ngSubmit)="onSubmit(membresiaForm)">
            <div class="row">
              <div class="col-md-6 mb-3">
                <label for="tipo" class="form-label">
                  <strong>Tipo de Membresía <span class="text-danger">*</span></strong>
                </label>
                <input 
                  type="text" 
                  class="form-control" 
                  id="tipo"
                  name="tipo"
                  [(ngModel)]="membresia.tipo"
                  #tipo="ngModel"
                  required
                  maxlength="50"
                  placeholder="Ej: Premium, Básica, VIP">
                <div *ngIf="tipo.invalid && (tipo.dirty || tipo.touched)" class="invalid-feedback d-block">
                  <div *ngIf="tipo.errors?.['required']">El tipo es requerido</div>
                </div>
              </div>

              <div class="col-md-6 mb-3">
                <label for="precio" class="form-label">
                  <strong>Precio <span class="text-danger">*</span></strong>
                </label>
                <input 
                  type="number" 
                  class="form-control" 
                  id="precio"
                  name="precio"
                  [(ngModel)]="membresia.precio"
                  #precio="ngModel"
                  required
                  min="0.01"
                  step="0.01"
                  placeholder="0.00">
                <div *ngIf="precio.invalid && (precio.dirty || precio.touched)" class="invalid-feedback d-block">
                  <div *ngIf="precio.errors?.['required']">El precio es requerido</div>
                  <div *ngIf="precio.errors?.['min']">El precio debe ser mayor a 0</div>
                </div>
              </div>
            </div>

            <div class="row">
              <div class="col-md-6 mb-3">
                <label for="duracionMeses" class="form-label">
                  <strong>Duración (Meses) <span class="text-danger">*</span></strong>
                </label>
                <input 
                  type="number" 
                  class="form-control" 
                  id="duracionMeses"
                  name="duracionMeses"
                  [(ngModel)]="membresia.duracionMeses"
                  #duracionMeses="ngModel"
                  required
                  min="1"
                  max="60"
                  placeholder="Ej: 12">
                <div *ngIf="duracionMeses.invalid && (duracionMeses.dirty || duracionMeses.touched)" class="invalid-feedback d-block">
                  <div *ngIf="duracionMeses.errors?.['required']">La duración es requerida</div>
                  <div *ngIf="duracionMeses.errors?.['min']">La duración debe ser mayor a 0</div>
                </div>
              </div>

              <div class="col-md-6 mb-3">
                <label for="estado" class="form-label">
                  <strong>Estado <span class="text-danger">*</span></strong>
                </label>
                <select 
                  class="form-select" 
                  id="estado"
                  name="estado"
                  [(ngModel)]="membresia.estado"
                  #estado="ngModel"
                  required>
                  <option value="">Seleccionar estado...</option>
                  <option value="1">Activa</option>
                  <option value="0">Inactiva</option>
                </select>
                <div *ngIf="estado.invalid && (estado.dirty || estado.touched)" class="invalid-feedback d-block">
                  <div *ngIf="estado.errors?.['required']">Debe seleccionar un estado</div>
                </div>
              </div>
            </div>

            <div class="mb-3">
              <label for="descripcion" class="form-label">
                <strong>Descripción <span class="text-danger">*</span></strong>
              </label>
              <textarea 
                class="form-control" 
                id="descripcion"
                name="descripcion"
                [(ngModel)]="membresia.descripcion"
                #descripcion="ngModel"
                required
                rows="4"
                maxlength="500"
                placeholder="Describe los beneficios y características de esta membresía..."></textarea>
              <div *ngIf="descripcion.invalid && (descripcion.dirty || descripcion.touched)" class="invalid-feedback d-block">
                <div *ngIf="descripcion.errors?.['required']">La descripción es requerida</div>
              </div>
            </div>

            <div *ngIf="validationErrors.length > 0" class="alert alert-danger">
              <h6><i class="fas fa-exclamation-triangle"></i> Errores de validación:</h6>
              <ul class="mb-0">
                <li *ngFor="let error of validationErrors">{{error}}</li>
              </ul>
            </div>

            <div class="d-flex justify-content-between">
              <button 
                type="button" 
                class="btn btn-secondary"
                (click)="goBack()"
                [disabled]="isLoading">
                <i class="fas fa-arrow-left me-2"></i>Cancelar
              </button>
              
              <button 
                type="submit" 
                class="btn btn-primary"
                [disabled]="!membresiaForm.form.valid || isLoading">
                <i class="fas fa-save me-2"></i>
                <span *ngIf="!isLoading">Actualizar Membresía</span>
                <span *ngIf="isLoading">
                  <span class="spinner-border spinner-border-sm me-2"></span>
                  Actualizando...
                </span>
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
