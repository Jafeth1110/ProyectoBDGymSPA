<div class="container">
  <!-- Loading -->
  <div *ngIf="isLoading" class="card loading-card">
    <div class="card-header">
      <h2><i class="fas fa-spinner fa-spin"></i> Cargando...</h2>
    </div>
    <div class="card-body">
      <div class="spinner-container">
        <div class="spinner"></div>
        <p>Cargando datos de la inscripción...</p>
      </div>
    </div>
  </div>

  <!-- Formulario -->
  <div *ngIf="!isLoading" class="card">
    <div class="card-header">
      <h2><i class="fas fa-edit icon"></i> Editar Inscripción a Clase</h2>
    </div>

    <form #inscripcionForm="ngForm" (ngSubmit)="onSubmit(inscripcionForm)">
      <div class="card-body">
        <div class="form-grid">
          <!-- Cliente -->
          <div class="form-group">
            <label class="form-label">Cliente <span class="required">*</span></label>
            <select 
              class="form-control" 
              name="idCliente" 
              [(ngModel)]="inscripcion.idCliente"
              #idCliente="ngModel"
              required>
              <option value="">Seleccionar cliente...</option>
              <option *ngFor="let cliente of clientes" [value]="cliente.idCliente">
                {{ cliente.user?.nombre }} {{ cliente.user?.apellido }}
              </option>
            </select>
            <div *ngIf="idCliente.invalid && (idCliente.touched || idCliente.dirty)" class="error-message">
              Debe seleccionar un cliente.
            </div>
          </div>

          <!-- Entrenador -->
          <div class="form-group">
            <label class="form-label">Entrenador <span class="required">*</span></label>
            <select 
              class="form-control" 
              name="idEntrenador" 
              [(ngModel)]="inscripcion.idEntrenador"
              #idEntrenador="ngModel"
              required>
              <option value="">Seleccionar entrenador...</option>
              <option *ngFor="let entrenador of entrenadores" [value]="entrenador.idEntrenador">
                {{ entrenador.user?.nombre }} {{ entrenador.user?.apellido }}
              </option>
            </select>
            <div *ngIf="idEntrenador.invalid && (idEntrenador.touched || idEntrenador.dirty)" class="error-message">
              Debe seleccionar un entrenador.
            </div>
          </div>

          <!-- Clase -->
          <div class="form-group">
            <label class="form-label">Clase <span class="required">*</span></label>
            <select 
              class="form-control"
              name="idClase"
              [(ngModel)]="inscripcion.idClase"
              #idClase="ngModel"
              required>
              <option value="">Seleccionar clase...</option>
              <option *ngFor="let clase of clases" [value]="clase.idClase">
                {{ clase.nombre }} - Capacidad: {{ clase.capacidad }}
              </option>
            </select>
            <div *ngIf="idClase.invalid && (idClase.touched || idClase.dirty)" class="error-message">
              Debe seleccionar una clase.
            </div>
          </div>

          <!-- Fecha Inscripción -->
          <div class="form-group">
            <label class="form-label">Fecha de Inscripción <span class="required">*</span></label>
            <input 
              type="date" 
              class="form-control" 
              name="fechaInscripcion" 
              [(ngModel)]="inscripcion.fechaInscripcion"
              #fechaInscripcion="ngModel"
              required>
            <div *ngIf="fechaInscripcion.invalid && (fechaInscripcion.touched || fechaInscripcion.dirty)" class="error-message">
              La fecha de inscripción es requerida.
            </div>
          </div>
        </div>

        <!-- Errores -->
        <div *ngIf="validationErrors.length > 0" class="error-alert">
          <h6><i class="fas fa-exclamation-circle"></i> Errores de validación</h6>
          <ul>
            <li *ngFor="let error of validationErrors">{{ error }}</li>
          </ul>
        </div>
      </div>

      <!-- Footer -->
      <div class="card-footer">
        <button type="button" class="btn-secondary" (click)="goBack()" [disabled]="isLoading">
          Cancelar
        </button>
        <button type="submit" class="btn-primary" [disabled]="!inscripcionForm.form.valid || isLoading">
          <span *ngIf="!isLoading"><i class="fas fa-save"></i> Actualizar Inscripción</span>
          <span *ngIf="isLoading"> Actualizando...</span>
        </button>
      </div>
    </form>
  </div>
</div>
