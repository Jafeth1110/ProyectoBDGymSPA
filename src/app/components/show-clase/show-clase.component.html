<div class="container" *ngIf="clase">
  <div class="card">
    <div class="card-header">
      <h2>Detalles de la Clase</h2>
      <div class="actions">
        <button class="btn-primary" (click)="editClase()" title="Editar clase" *ngIf="!isClient && !isTrainer"> 
          Editar
        </button>
        <button class="btn-danger" (click)="deleteClase()" title="Eliminar clase" *ngIf="!isClient && !isTrainer">
          Eliminar
        </button>
      </div>
    </div>
    
    <div class="card-body">
      <div class="details-grid">
        <div class="detail-item">
          <label>ID de la Clase:</label>
          <span>{{ clase.idClase }}</span>
        </div>
        
        <div class="detail-item">
          <label>Nombre:</label>
          <span class="highlight">{{ clase.nombre }}</span>
        </div>
        
        <div class="detail-item">
          <label>Descripción:</label>
          <span class="description">{{ clase.descripcion }}</span>
        </div>
        
        <div class="detail-item">
          <label>Cupo Máximo:</label>
          <span class="capacity">{{ clase.cupoMax }} personas</span>
        </div>

        <div class="detail-item" *ngIf="clase.cuposDisponibles !== undefined">
          <label>Cupos disponibles:</label>
          <span class="capacity">{{ clase.cuposDisponibles }}</span>
        </div>

        <div class="detail-item">
          <label>Horario:</label>
          <span class="horario">{{ clase.getHorarioCompleto() }}</span>
        </div>
      </div>
    </div>
    
    <div class="card-footer">
      <button class="btn-secondary" (click)="goBack()">
        Volver a la Lista
      </button>
    </div>
  </div>
</div>

<div class="container" *ngIf="!clase && !isLoading">
  <div class="card error-card">
    <h2>Clase No Encontrada</h2>
    <p>La clase que buscas no existe o no se pudo cargar.</p>
    <button class="btn-secondary" (click)="goBack()">Volver a la Lista</button>
  </div>
</div>

<div class="container" *ngIf="isLoading">
  <div class="card loading-card">
    <h2>Cargando...</h2>
    <div class="spinner"></div>
  </div>
</div>
